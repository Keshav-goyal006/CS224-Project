    <script type='module'>
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        
        // Initialize Mermaid
        mermaid.initialize({ 
            startOnLoad: false, 
            theme: 'default',
            securityLevel: 'loose'
        });

        const codeInput = document.getElementById('code');
        const previewDiv = document.getElementById('preview');

        // Function to render the diagram
        async function renderDiagram() {
            const code = codeInput.value.trim();
            
            if (!code) {
                previewDiv.innerHTML = '';
                return;
            }

            try {
                // Mermaid requires a unique ID for rendering
                const id = 'mermaid-svg-' + Date.now();
                const { svg } = await mermaid.render(id, code);
                previewDiv.innerHTML = svg;
            } catch (error) {
                // If there's a syntax error while typing, catch it to prevent crashes
                // We don't overwrite the last valid SVG immediately to avoid flickering
                console.warn("Mermaid syntax error:", error.message);
            }
        }

        // Listen for user typing
        codeInput.addEventListener('input', renderDiagram);
        
        // Render the default diagram on load
        renderDiagram();
    </script>
